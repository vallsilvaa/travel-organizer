name: User story
description: Describe user value for a product capability
title: "[Story]: "
labels: ["user story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Describe the user, their need, and the expected value.
      placeholder: As a traveler, I want to... so that...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that must be true.
      placeholder: |
        - [ ] Given..., when..., then...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes and dependencies
      description: Add designs, decisions, dependencies, or out-of-scope details.
